<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Practice Checks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Fredoka:wght@500;600&family=Lexend:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="styles/check.css">
<style>:root{--bg: #e7eeec;--fg: #13302e;--muted: #4f6663;--card: #f7faf9;--line: #c3d2cf;--accent: #0e5c5a;--on-accent: #f3fbf9;--display: "Fredoka", "Inter Display", "Inter", system-ui, sans-serif;--body: "Lexend", "Inter", system-ui, sans-serif}@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg: #0c1c1c;--fg: #dcebe8;--muted: #92aaa6;--card: #132827;--line: #2a4543;--accent: #5cc0b0;--on-accent: #062221;color-scheme:dark}}:root[data-theme=dark]{--bg: #0c1c1c;--fg: #dcebe8;--muted: #92aaa6;--card: #132827;--line: #2a4543;--accent: #5cc0b0;--on-accent: #062221;color-scheme:dark}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body)}.bar{padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:8.5in;margin:0 auto;box-sizing:border-box;display:grid;gap:12px}h1{font-family:var(--display);font-weight:600;font-size:1.8rem;margin:0;text-wrap:balance}.bar p{margin:0;color:var(--muted);line-height:1.5;max-width:62ch}.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.controls label{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:.95rem}.controls select{font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:8px 12px}.btn{font:inherit;font-weight:600;border:0;border-radius:999px;padding:10px 18px;background:var(--accent);color:var(--on-accent);cursor:pointer}.btn:focus-visible,.controls label:focus-within,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}a{color:var(--accent)}.sheets{display:grid;gap:24px;justify-items:center;padding-block:8px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}.sheet{width:8.5in;max-width:100%;aspect-ratio:8.5 / 11;background:#fff;color:#1d2b24;box-shadow:0 2px 14px #0000002e;box-sizing:border-box;padding:3.5% 10%;display:flex;overflow:hidden;flex-direction:column;justify-content:space-around;container-type:inline-size}.sheet-tag{font-size:1.2cqw;color:#66756b;text-align:center;letter-spacing:.08em;text-transform:uppercase}.slot{border:.15cqw dashed #9aa79d;padding:1.2cqw;border-radius:.6cqw}.key{justify-content:flex-start;gap:2cqw;font-size:1.7cqw}.key h2{font-family:var(--display);font-size:3cqw;margin:0}.key table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}.key th,.key td{text-align:left;padding:.7cqw 1cqw;border-bottom:.12cqw solid #d3dbd5}.key td.num,.key th.num{text-align:right;font-family:Space Mono,DejaVu Sans Mono,monospace}@media print{@page{size:letter;margin:0}body{background:#fff}.bar{display:none}.sheets{display:block;padding:0}.sheet{width:8.5in;height:11in;max-width:none;aspect-ratio:auto;box-shadow:none;page-break-after:always;break-after:page;padding:.3in .85in;overflow:hidden}.sheet:last-child{page-break-after:auto;break-after:auto}}</style>
</head>
<body>
<div class="bar">
<h1>Practice Checks</h1>
<p>Print these, hand one to each student, and they deposit it in the Check Game bank app. Students write their own name on the "Pay to the order of" line and sign the back. Each check number can only be deposited once per account.</p>
<div class="controls">
<select id="level" aria-label="Which checks">
<option value="0">All levels (24 checks)</option>
<option value="1">Level 1: whole dollars</option>
<option value="2">Level 2: 25¢, 50¢, 75¢</option>
<option value="3">Level 3: any cents</option>
</select>
<label><input type="checkbox" id="backs" checked> Print backs (double-sided, flip on long edge)</label>
<label><input type="checkbox" id="key" checked> Teacher key page</label>
<button class="btn" id="print" type="button" hidden>Print checks</button>
</div>
<p id="note"><a href="index.html">Back to the bank app</a></p>
</div>
<div class="sheets" id="sheets"></div>
<script type="module" src="src/print.js"></script>
</body>
</html>
